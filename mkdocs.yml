site_name: Potter ⚡ — Continuous Development
site_description: Fleet de agentes cobrindo o ciclo de vida de software no GitHub
docs_dir: docs
theme:
  name: material
  language: pt-BR
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: yellow
      toggle:
        icon: material/weather-sunny
        name: tema claro
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: yellow
      toggle:
        icon: material/weather-night
        name: tema escuro
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - toc.follow
    - search.suggest
    - content.code.copy
extra_css:
  - stylesheets/potter.css
markdown_extensions:
  - admonition
  - tables
  - attr_list
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - toc:
      permalink: true
nav:
  - Início: index.md
  - Estado do projeto: status.md
  - Tutoriais:
      - Operador (como usar): tutorial-operador.md
      - Dev / arquitetura: tutorial-dev.md
      - Convenção de diagramas: convencao-diagramas.md
  - Arquitetura:
      - Mapa do sistema: mapa.md
      - Visão geral: arquitetura.md
      - Orquestrador: design/orquestrador.md
      - Responsabilidades: responsabilidades.md
      - Status da implementação: status-implementacao.md
  - Trilhas (como funciona):
      - 0 — Papéis → agentes: trilha-0-papeis.md
      - A — Contratos de trabalho: trilha-a-contratos.md
      - B — Orquestração e gatilhos: trilha-b-orquestracao.md
      - C — Skills do fleet: trilha-c-skills.md
      - D — Review de PR: trilha-d-review.md
      - E — Padrões de código: trilha-e-padroes.md
      - F — Economia de token: trilha-f-token.md
      - G — Memória e second brain: trilha-g-memoria.md
      - H — Qualidade e segurança: trilha-h-qualidade.md
      - I — Roteamento de modelos: trilha-i-roteamento.md
      - J — Escala e backpressure: trilha-j-escala.md
      - K — Runtime containerizado: trilha-k-runtime.md
      - L — Modelo de custo: trilha-l-custo.md
      - M — Observabilidade e Telegram: trilha-m-observabilidade.md
  - Fluxos:
      - Visão geral: fluxos/README.md
      - Refinamento: fluxos/01-refinamento.md
      - Implementação: fluxos/02-implementacao.md
      - Code review: fluxos/03-code-review.md
      - Breakdown de épico: fluxos/04-breakdown-epico.md
  - Operação:
      - Gatilhos: triggers.md
      - Telegram: telegram-guia.md
      - Ferramentas (code-intel): TOOLS.md
