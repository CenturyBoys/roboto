# PoC isolado (N3): Postgres + container do fleet (roboto + Claude Code + ccr + Playwright).
# Uso: docker compose -f poc/compose.poc.yml --env-file poc/.env.poc up --build
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: roboto
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dev-only-change-me}
      POSTGRES_DB: roboto
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roboto"]
      interval: 10s
      timeout: 5s
      retries: 5

  poc:
    build:
      context: ..
      dockerfile: poc/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: .env.poc
        required: false # Fase 0 não precisa de secrets
    environment:
      DATABASE_URL: postgresql://roboto:${DB_PASSWORD:-dev-only-change-me}@db:5432/roboto
      TTYD_BASE: ${TTYD_BASE:-http://localhost:7681} # terminal web (ttyd+tmux) p/ o console
      COPILOT_MODE: ${COPILOT_MODE:-tmux} # co-piloto do chat: tmux (CLI real + terminal) | sdk
      ROBOTO_BASE_BRANCH: ${ROBOTO_BASE_BRANCH:-develop} # gitflow do alvo: PR vai pra develop, não main
      REFINE_MODEL: ${REFINE_MODEL:-openrouter,z-ai/glm-4.5-air} # GLM-4.5-Air (local) — refino; busca web é harness-driven
      JUDGE_MODEL: ${JUDGE_MODEL:-z-ai/glm-4.5-air} # GLM-4.5-Air via gateway OpenRouter direto — review/juiz
      # TAVILY_API_KEY vem do .env.poc (env_file) — busca web só no refino (ver app/web_research)
      JEV_MODEL: ${JEV_MODEL:-typesafe/jev-router} # Jev degrau-2: decide criticidade da pesquisa (#222)
      REFINE_PERSONA: ${REFINE_PERSONA:-} # âncora de papel no refino (tech lead). Ligada por default; "0"=off
      IMPL_PERSONA: ${IMPL_PERSONA:-} # âncora de papel no impl (eng. sênior). Ligada por default; "0"=off
    ports:
      - "8090:8080" # servidor ASGI (webhook + console) — 8090 no host (8080 ocupada)
      - "7681:7681" # ttyd — terminal web (tmux no container)
    volumes:
      # sessões do motor (Claude Code) persistem entre rebuilds → o "Assumir" (resume) sobrevive.
      # NÃO persiste ~/.claude-code-router (regenerado no boot) p/ evitar PID fantasma. (#219)
      - claude_sessions:/home/pwuser/.claude
    # /work é efêmero (não-root): o container clona o repo a cada subida em /work/<owner>/<repo>.
    # recursos da máquina: ajuste conforme necessário
    # deploy:
    #   resources:
    #     limits: { cpus: "4", memory: 8g }

volumes:
  claude_sessions: # histórico das sessões do motor (p/ o "Assumir"/resume sobreviver a rebuild, #219)
