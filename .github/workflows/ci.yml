name: ci

# Tier 1 determinístico (AGENTS.md): lint + tipos + testes. CI é o juiz do "pronto" (DoD).
on:
  push:
    branches: [main]
  pull_request:

jobs:
  tier1:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: roboto
          POSTGRES_PASSWORD: roboto
          POSTGRES_DB: roboto
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://roboto:roboto@localhost:5432/roboto
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: mypy
      - run: pytest -q
