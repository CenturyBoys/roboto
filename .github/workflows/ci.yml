name: ci

# Tier 1 determinístico (AGENTS.md): lint + tipos + testes. CI é o juiz do "pronto" (DoD).
on:
  push:
    branches: [main]
  pull_request:

jobs:
  tier1:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: roboto
          POSTGRES_PASSWORD: roboto
          POSTGRES_DB: roboto
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://roboto:roboto@localhost:5432/roboto
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: mypy
      - run: pytest -q

  # Tier 1 do front (trilha O): tipos + testes + build do cockpit React.
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/ui/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
